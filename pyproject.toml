[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evm-canon"
version = "0.2.0"
description = "EVM Token Canonicalizer - deterministic, schema-validated normalization of messy EVM token data (OKX.AI A2MCP service)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "eth-utils>=4.0",
    "eth-hash[pycryptodome]>=0.7",
    "eth-abi>=5.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "okxweb3-app-x402[evm]>=0.1.1", "httpx>=0.27"]

[project.scripts]
evm-canon = "evm_canon.cli:main"
evm-canon-serve = "evm_canon.server:main"

[tool.setuptools.packages.find]
include = ["evm_canon*"]

[tool.setuptools.package-data]
evm_canon = ["data/*.json"]
